name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: Package app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Package app
        run: scripts/package-app.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Tangle.zip
            dist/Tangle.dmg
          draft: false
          prerelease: false
